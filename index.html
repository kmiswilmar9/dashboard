<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工厂督查数据看板 · 1-6月</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<style>
  :root{ --bg:#eef1f6; --panel:#ffffff; --border:#e3e9f2;
    --blue:#2b5aa7; --navy:#1a3a6b; --green:#1e9e63; --orange:#e8973a; --red:#e0483f;
    --text:#222; --muted:#888; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:"Microsoft YaHei","PingFang SC",sans-serif; background:var(--bg); color:var(--text); }
  .wrap{ max-width:1440px; margin:0 auto; padding:18px 22px 46px; }

  .banner{ position:relative; display:flex; justify-content:space-between; align-items:center;
    padding:24px 30px; margin-bottom:16px; border-radius:12px; overflow:hidden;
    background:linear-gradient(135deg,#1a3a6b,#2b5aa7); color:#fff; }
  .banner::after{ content:''; position:absolute; bottom:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg, transparent, #7db4ff, transparent);
    background-size:200% 100%; animation:scan 3.2s linear infinite; }
  @keyframes scan{ 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  .banner h1{ font-size:26px; font-weight:800; letter-spacing:2px; }
  .banner h1 .diamond{ color:#7db4ff; margin-right:6px; }
  .banner .sub{ margin-top:7px; font-size:13px; opacity:.85; letter-spacing:1px; }
  .b-right{ text-align:right; }
  .live{ display:inline-flex; align-items:center; gap:6px; font-size:11px; color:#8ef0b8;
    letter-spacing:2px; border:1px solid rgba(142,240,184,.5); border-radius:20px; padding:3px 12px; }
  .live .dot{ width:7px; height:7px; border-radius:50%; background:#8ef0b8;
    box-shadow:0 0 8px #8ef0b8; animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.25} }
  #clock{ margin-top:8px; font-size:13px; color:#dbe7ff; font-variant-numeric:tabular-nums; letter-spacing:1px; }

  .panel{ background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:18px 20px; margin-bottom:16px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .panel h2{ font-size:15px; font-weight:700; color:var(--navy); margin-bottom:14px;
    padding-left:12px; border-left:4px solid var(--blue); letter-spacing:1px;
    display:flex; align-items:center; }
  .panel h2 .hint{ font-size:11px; color:var(--muted); font-weight:400; margin-left:10px; letter-spacing:0; }

  .controls{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .controls label{ font-size:13px; color:var(--muted); }
  .controls select,.controls input{ background:#fff; border:1px solid #ccd6e3;
    border-radius:8px; color:var(--text); padding:7px 12px; font-size:13px; outline:none; }
  .controls input{ width:220px; }
  .controls select:focus,.controls input:focus{ border-color:var(--blue); }
  .btn-reset{ background:#f5f7fa; border:1px solid #ccd6e3; color:#555;
    border-radius:8px; padding:7px 18px; font-size:13px; cursor:pointer; transition:.2s; }
  .btn-reset:hover{ background:#e8edf4; }
  .count{ margin-left:auto; font-size:12px; color:var(--muted); }

  .cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:16px; }
  .card{ position:relative; background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:16px 20px 14px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .card::before{ content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, var(--ac), transparent); }
  .c-label{ font-size:12px; color:var(--muted); letter-spacing:1px; }
  .c-value{ font-size:30px; font-weight:800; margin-top:6px; color:var(--ac);
    font-variant-numeric:tabular-nums; }
  .c-detail{ font-size:11px; color:var(--muted); margin-top:5px; }

  .rbar{ display:flex; align-items:center; gap:14px; padding:8px 10px; border-radius:10px;
    cursor:pointer; transition:background .2s; }
  .rbar:hover{ background:#f2f6fc; }
  .rbar.active{ background:#e7effc; box-shadow:inset 0 0 0 1px rgba(43,90,167,.3); }
  .rname{ width:150px; text-align:right; font-size:13px; color:var(--navy); font-weight:600; }
  .rname span{ display:block; font-size:11px; color:var(--muted); font-weight:400; margin-top:2px; }
  .rtrack{ flex:1; height:14px; background:#eef1f6; border-radius:7px; overflow:hidden; }
  .rfill{ height:100%; width:0; border-radius:7px; transition:width 1.1s cubic-bezier(.22,.8,.36,1); }
  .rpct{ width:110px; font-size:13px; font-weight:700; color:var(--navy); font-variant-numeric:tabular-nums; }
  .rpct span{ font-size:11px; color:var(--muted); font-weight:400; margin-left:6px; }

  .row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin-bottom:16px; }
  .chart{ height:280px; }
  .chart-tall{ height:340px; }

  .table-scroll{ max-height:520px; overflow:auto; border-radius:10px; border:1px solid var(--border); }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  th,td{ padding:8px 9px; text-align:center; border-bottom:1px solid #eee; white-space:nowrap; }
  th{ position:sticky; top:0; z-index:2; background:var(--navy); color:#fff; font-weight:600;
    cursor:pointer; user-select:none; }
  th .arr{ font-size:9px; margin-left:3px; opacity:.75; }
  tbody tr{ cursor:pointer; transition:background .15s; }
  tbody tr:nth-child(even){ background:#f8f9fb; }
  tbody tr:hover{ background:#eaf1fb; }
  td.left{ text-align:left; }
  .rate-good{ color:var(--green); font-weight:700; }
  .rate-mid{ color:var(--orange); font-weight:700; }
  .rate-bad{ color:var(--red); font-weight:700; }
  .footer{ text-align:center; font-size:12px; color:#999; padding:14px 0 6px; letter-spacing:1px; }

  .modal-mask{ position:fixed; inset:0; background:rgba(15,25,45,.55);
    display:none; align-items:center; justify-content:center; z-index:99; }
  .modal-mask.show{ display:flex; }
  .modal{ position:relative; width:min(680px,92vw); max-height:88vh; overflow:auto;
    background:#fff; border:1px solid var(--border);
    border-radius:14px; padding:26px 30px; box-shadow:0 8px 40px rgba(0,0,0,.25); }
  .modal .close{ position:absolute; top:14px; right:18px; font-size:22px; color:#999; cursor:pointer; line-height:1; }
  .modal .close:hover{ color:var(--red); }
  .modal h3{ font-size:19px; color:var(--navy); }
  .modal .msub{ font-size:12.5px; color:var(--muted); margin:5px 0 16px; }
  .mgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:18px; }
  .mitem{ background:#f6f8fb; border:1px solid var(--border); border-radius:10px; padding:10px 14px; }
  .mitem .k{ font-size:11px; color:var(--muted); }
  .mitem .v{ font-size:18px; font-weight:700; margin-top:3px; color:var(--navy); }
  .mchart-box{ height:220px; }

  @media (max-width:1000px){ .row3{ grid-template-columns:1fr; } }
  @media (max-width:640px){
    .wrap{ padding:12px 12px 30px; }
    .banner{ flex-direction:column; align-items:flex-start; gap:10px; padding:18px 20px; }
    .b-right{ text-align:left; }
    .banner h1{ font-size:21px; }
    .rname{ width:100px; }
    .rpct{ width:92px; }
    .controls input{ width:100%; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="banner">
    <div>
      <h1><span class="diamond">&#9670;</span>工厂督查数据看板</h1>
      <div class="sub">华东区&amp;东北区 · 2026年1-6月 · <span id="factCount"></span> · 全维度可视化版</div>
    </div>
    <div class="b-right">
      <div class="live"><span class="dot"></span>LIVE</div>
      <div id="clock"></div>
    </div>
  </div>

  <div class="panel controls">
    <label>区域</label>
    <select id="regionSel"></select>
    <label>搜索</label>
    <input id="searchBox" type="text" placeholder="输入工厂 / 经理名称…">
    <button class="btn-reset" id="resetBtn">重置</button>
    <span class="count" id="countLabel"></span>
  </div>

  <div class="cards" id="cards"></div>

  <div class="panel">
    <h2>区域作战进度<span class="hint">点击条形筛选 / 再次点击取消</span></h2>
    <div id="regionBars"></div>
  </div>

  <div class="row3">
    <div class="panel"><h2>整体完成率</h2><div class="chart" id="gaugeBox"></div></div>
    <div class="panel"><h2>区域三维对比<span class="hint">完成率·覆盖率·配置率</span></h2><div class="chart" id="radarBox"></div></div>
    <div class="panel"><h2>检查频次趋势</h2><div class="chart" id="trendBox"></div></div>
  </div>

  <div class="row3">
    <div class="panel"><h2>完成率 TOP10</h2><div class="chart chart-tall" id="topBox"></div></div>
    <div class="panel"><h2>待提升预警 TOP10</h2><div class="chart chart-tall" id="warnBox"></div></div>
    <div class="panel"><h2>覆盖率 &amp; 配置率</h2><div class="chart chart-tall" id="ringBox"></div></div>
  </div>

  <div class="panel">
    <h2>工厂明细<span class="hint">点击表头排序 · 点击行查看详情</span></h2>
    <div class="table-scroll">
      <table>
        <thead><tr id="thead"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="footer">数据更新时间：2026-07-25 21:40 · 每日自动同步 · 单文件可视化看板</div>
</div>

<div class="modal-mask" id="modalMask">
  <div class="modal">
    <span class="close" id="modalClose">&times;</span>
    <h3 id="mTitle"></h3>
    <div class="msub" id="mSub"></div>
    <div class="mgrid" id="mGrid"></div>
    <div class="mchart-box" id="mChartBox"></div>
  </div>
</div>

const MONTHS = ["1月", "2月", "3月", "4月", "5月", "6月"];
const state = { region:'all', search:'', sortKey:'doneRate', sortDir:-1 };
const charts = {};
let modalChart = null;

const pct = v => (v*100).toFixed(1) + '%';
const rateCls = v => v >= 0.5 ? 'rate-good' : (v >= 0.3 ? 'rate-mid' : 'rate-bad');

/* ---------- filter & sort ---------- */
function getFiltered(){
  const kw = state.search.trim().toLowerCase();
  let list = DATA.records.filter(r =>
    (state.region==='all' || r.region===state.region) &&
    (kw==='' || r.factory.toLowerCase().includes(kw) ||
     r.manager.toLowerCase().includes(kw) || r.region.toLowerCase().includes(kw)));
  const k = state.sortKey, d = state.sortDir;
  return [...list].sort((a,b)=>{
    const va=a[k], vb=b[k];
    if (typeof va==='string') return va.localeCompare(vb,'zh')*d;
    return (va-vb)*d;
  });
}

/* ---------- KPI cards with count-up ---------- */
function countUp(el, target, fmt, dur){
  dur = dur || 700;
  const t0 = performance.now();
  function tick(now){
    const p = Math.min((now-t0)/dur, 1);
    const e = 1 - Math.pow(1-p, 3);
    el.textContent = fmt(target*e);
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
function renderCards(list){
  const s = f => list.reduce((t,r)=>t+r[f],0);
  const std=s('stdReports'), done=s('doneFreq'), tgt=s('targetMkts'), cov=s('coveredMkts');
  const need=s('need'), have=s('have'), exm=s('extraMkts'), exf=s('extraFreq');
  const dr = std?done/std:0, cr = tgt?cov/tgt:0, sr = need?have/need:0;
  const defs = [
    {label:'工厂数', val:list.length, fmt:v=>String(Math.round(v)), color:'#2b5aa7', detail:'覆盖市场 '+cov+'/'+tgt},
    {label:'完成率', val:dr*100, fmt:v=>v.toFixed(1)+'%', color:'#e0483f', detail:'已完成 '+done+' / 标准 '+std},
    {label:'覆盖率', val:cr*100, fmt:v=>v.toFixed(1)+'%', color:'#1e9e63', detail:'已覆盖 '+cov+' / 目标 '+tgt},
    {label:'人员配置率', val:sr*100, fmt:v=>v.toFixed(1)+'%', color:'#7b5aa7', detail:'已配 '+have+' / 应配 '+need},
    {label:'已完成总频次', val:done, fmt:v=>String(Math.round(v)), color:'#e8973a', detail:'全年标准量 '+std},
    {label:'额外市场/频次', val:exm, fmt:v=>Math.round(v)+' / '+exf, color:'#c2410c', detail:'目标市场之外新增'}
  ];
  document.getElementById('cards').innerHTML = defs.map((c,i)=>
    `<div class="card" style="--ac:${c.color}"><div class="c-label">${c.label}</div>` +
    `<div class="c-value" id="cv${i}">0</div><div class="c-detail">${c.detail}</div></div>`).join('');
  defs.forEach((c,i)=>countUp(document.getElementById('cv'+i), c.val, c.fmt));
}

/* ---------- region bars ---------- */
function regionAgg(){
  const m = {};
  DATA.records.forEach(r=>{
    const g = m[r.region] || (m[r.region] = {count:0, std:0, done:0, manager:r.manager});
    g.count++; g.std += r.stdReports; g.done += r.doneFreq;
  });
  return Object.entries(m).map(([region,g])=>({
    region, count:g.count, std:g.std, done:g.done, manager:g.manager,
    doneRate: g.std? g.done/g.std : 0 })).sort((a,b)=>b.doneRate-a.doneRate);
}
function renderRegionBars(){
  const rows = regionAgg();
  const box = document.getElementById('regionBars');
  box.innerHTML = rows.map(r=>{
    const w = Math.min(r.doneRate*100, 100);
    const active = state.region===r.region ? ' active' : '';
    const c = r.doneRate>=0.5 ? '#1e9e63' : (r.doneRate>=0.3 ? '#e8973a' : '#e0483f');
    return `<div class="rbar${active}" data-region="${r.region}">` +
      `<div class="rname">${r.region}<span>${r.manager} · ${r.count}厂</span></div>` +
      `<div class="rtrack"><div class="rfill" data-w="${w}" ` +
      `style="background:linear-gradient(90deg, ${c}55, ${c});"></div></div>` +
      `<div class="rpct">${pct(r.doneRate)}<span>${r.done}/${r.std}</span></div></div>`;
  }).join('');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    box.querySelectorAll('.rfill').forEach(el=>{ el.style.width = el.dataset.w + '%'; });
  }));
  box.querySelectorAll('.rbar').forEach(el=>{
    el.addEventListener('click', ()=>{
      const rg = el.dataset.region;
      state.region = (state.region===rg) ? 'all' : rg;
      document.getElementById('regionSel').value = state.region;
      renderAll();
    });
  });
}

/* ---------- gauge ---------- */
function renderGauge(list){
  const std = list.reduce((t,r)=>t+r.stdReports,0);
  const done = list.reduce((t,r)=>t+r.doneFreq,0);
  const rate = std ? +(done/std*100).toFixed(1) : 0;
  charts.gauge.setOption({
    series:[{
      type:'gauge', startAngle:215, endAngle:-35, min:0, max:100,
      progress:{ show:true, width:16, roundCap:true,
        itemStyle:{ color:{ type:'linear', x:0, y:1, x2:1, y2:0,
          colorStops:[{offset:0,color:'#e0483f'},{offset:0.5,color:'#e8973a'},{offset:1,color:'#1e9e63'}]} } },
      pointer:{ show:false },
      axisLine:{ lineStyle:{ width:16, color:[[1,'rgba(0,0,0,.06)']] } },
      axisTick:{ show:false }, splitLine:{ show:false }, axisLabel:{ show:false },
      title:{ offsetCenter:[0,'72%'], fontSize:13, color:'#888' },
      detail:{ valueAnimation:true, offsetCenter:[0,'15%'], fontSize:34, fontWeight:'bold',
        color:'#2b5aa7', formatter:'{value}%' },
      data:[{ value:rate, name:'整体完成率' }]
    }]
  });
}

/* ---------- radar ---------- */
function renderRadar(){
  const colors = ['#2b5aa7','#1e9e63','#e8973a','#7b5aa7'];
  const agg = DATA.regions.map(rg=>{
    const rs = DATA.records.filter(r=>r.region===rg);
    const sum = f => rs.reduce((t,r)=>t+r[f],0);
    const std=sum('stdReports'), done=sum('doneFreq'), tgt=sum('targetMkts'),
          cov=sum('coveredMkts'), need=sum('need'), have=sum('have');
    return { name:rg, value:[ std?+(done/std*100).toFixed(1):0,
                              tgt?+(cov/tgt*100).toFixed(1):0,
                              need?+(have/need*100).toFixed(1):0 ] };
  });
  charts.radar.setOption({
    color: colors,
    legend:{ data:DATA.regions, bottom:0, textStyle:{ color:'#666', fontSize:11 },
             itemWidth:12, itemHeight:8 },
    radar:{
      center:['50%','45%'], radius:'58%',
      indicator:[ {name:'完成率', max:100}, {name:'覆盖率', max:100}, {name:'配置率', max:100} ],
      axisName:{ color:'#666', fontSize:11 },
      splitArea:{ areaStyle:{ color:['rgba(43,90,167,.02)','rgba(43,90,167,.05)'] } },
      axisLine:{ lineStyle:{ color:'#dfe6f0' } },
      splitLine:{ lineStyle:{ color:'#dfe6f0' } }
    },
    series:[{ type:'radar', symbolSize:4,
      data: agg.map(a=>({ name:a.name, value:a.value,
        lineStyle:{ width:2 }, areaStyle:{ opacity:.12 } })) }]
  });
}

/* ---------- trend ---------- */

  const totals = new Array(MONTHS.length).fill(0);
  list.forEach(r=> r.months.forEach((v,i)=> totals[i]+=v));
  charts.trend.setOption({
    grid:{ left:36, right:16, top:28, bottom:26 },
    tooltip:{ trigger:'axis', backgroundColor:'rgba(255,255,255,.96)',

    xAxis:{ type:'category', data:MONTHS, boundaryGap:false,
      axisLine:{ lineStyle:{ color:'#ccd6e3' } },
      axisLabel:{ color:'#888' }, axisTick:{ show:false } },

  });
}

/* ---------- TOP10 / warning ---------- */
function renderRanking(chart, list, asc, c1, c2, labelColor){
  const pick = [...list].sort((a,b)=> asc ? a.doneRate-b.doneRate : b.doneRate-a.doneRate).slice(0,10);
  const names = pick.map(r=>r.factory).reverse();
  const vals = pick.map(r=>+(r.doneRate*100).toFixed(1)).reverse();
  chart.setOption({
    grid:{ left:8, right:52, top:8, bottom:8, containLabel:true },
    xAxis:{ type:'value', max:100, axisLabel:{ show:false }, splitLine:{ show:false }, axisLine:{ show:false } },
    yAxis:{ type:'category', data:names, axisLine:{ show:false }, axisTick:{ show:false },
            axisLabel:{ color:'#555', fontSize:11 } },
    series:[{ type:'bar', data:vals, barWidth:12,
      itemStyle:{ borderRadius:[0,7,7,0],
        color:{ type:'linear', x:0, y:0, x2:1, y2:0, colorStops:[{offset:0,color:c1},{offset:1,color:c2}] } },
      label:{ show:true, position:'right', formatter:'{c}%', color:labelColor, fontSize:11, fontWeight:'bold' } }]
  });
}
function renderTop(list){
  renderRanking(charts.top, list, false, 'rgba(43,90,167,.25)', '#2b5aa7', '#2b5aa7');
}
function renderWarn(list){
  renderRanking(charts.warn, list, true, 'rgba(224,72,63,.22)', '#e0483f', '#e0483f');
}

/* ---------- double ring ---------- */
function renderRing(list){
  const sum = f => list.reduce((t,r)=>t+r[f],0);
  const tgt=sum('targetMkts'), cov=sum('coveredMkts'), need=sum('need'), have=sum('have');
  const cr = tgt ? +(cov/tgt*100).toFixed(1) : 0;
  const sr = need ? +(have/need*100).toFixed(1) : 0;
  charts.ring.setOption({
    title:[
      { text:cr+'%', subtext:'市场覆盖率', left:'25%', top:'42%', textAlign:'center',
        textStyle:{ color:'#1e9e63', fontSize:22, fontWeight:'bold' },
        subtextStyle:{ color:'#888', fontSize:11 }, itemGap:4 },
      { text:sr+'%', subtext:'人员配置率', left:'75%', top:'42%', textAlign:'center',
        textStyle:{ color:'#2b5aa7', fontSize:22, fontWeight:'bold' },
        subtextStyle:{ color:'#888', fontSize:11 }, itemGap:4 }
    ],
    series:[
      { type:'pie', radius:['52%','68%'], center:['25%','50%'], silent:true,
        label:{ show:false }, labelLine:{ show:false },
        data:[ { value:cov, itemStyle:{ color:'#1e9e63' } },
               { value:Math.max(tgt-cov,0), itemStyle:{ color:'rgba(0,0,0,.06)' } } ] },
      { type:'pie', radius:['52%','68%'], center:['75%','50%'], silent:true,
        label:{ show:false }, labelLine:{ show:false },
        data:[ { value:have, itemStyle:{ color:'#2b5aa7' } },
               { value:Math.max(need-have,0), itemStyle:{ color:'rgba(0,0,0,.06)' } } ] }
    ]
  });
}

/* ---------- table ---------- */
const COLS = [
  {key:'_idx', label:'#', sortable:false},
  {key:'region', label:'区域', sortable:true},
  {key:'factory', label:'工厂', sortable:true},
  {key:'need', label:'应配', sortable:true},
  {key:'have', label:'已配', sortable:true},
  {key:'targetMkts', label:'目标市场', sortable:true},
  {key:'coveredMkts', label:'已覆盖', sortable:true},
  {key:'coverRate', label:'覆盖率', sortable:true},
  {key:'stdReports', label:'标准量', sortable:true},
  {key:'doneFreq', label:'已完成', sortable:true},
  {key:'doneRate', label:'完成率', sortable:true},
  {key:'extraMkts', label:'额外市场', sortable:true},
  {key:'extraFreq', label:'额外频次', sortable:true}
];
function renderHead(){
  document.getElementById('thead').innerHTML = COLS.map(c=>{
    let arr = '';
    if (c.sortable && state.sortKey===c.key) arr = state.sortDir===-1 ? '▼' : '▲';
    return `<th data-key="${c.key}" data-sortable="${c.sortable}">${c.label}<span class="arr">${arr}</span></th>`;
  }).join('');
  document.querySelectorAll('#thead th').forEach(th=>{
    if (th.dataset.sortable!=='true') return;
    th.addEventListener('click', ()=>{
      const k = th.dataset.key;
      if (state.sortKey===k) state.sortDir = -state.sortDir;
      else { state.sortKey=k; state.sortDir=-1; }
      renderAll();
    });
  });
}
function renderTable(list){
  document.getElementById('tbody').innerHTML = list.map((r,i)=>
    `<tr data-idx="${DATA.records.indexOf(r)}">` +
    `<td>${i+1}</td><td>${r.region}</td><td class="left">${r.factory}</td>` +
    `<td>${r.need}</td><td>${r.have}</td><td>${r.targetMkts}</td><td>${r.coveredMkts}</td>` +
    `<td class="${rateCls(r.coverRate)}">${pct(r.coverRate)}</td>` +
    `<td>${r.stdReports}</td><td>${r.doneFreq}</td>` +
    `<td class="${rateCls(r.doneRate)}">${pct(r.doneRate)}</td>` +
    `<td>${r.extraMkts}</td><td>${r.extraFreq}</td></tr>`).join('');
  document.querySelectorAll('#tbody tr').forEach(tr=>{
    tr.addEventListener('click', ()=> openModal(DATA.records[+tr.dataset.idx]));
  });
}

/* ---------- modal ---------- */
function openModal(r){
  document.getElementById('mTitle').textContent = r.factory;
  document.getElementById('mSub').textContent = `${r.region} · 负责人：${r.manager}`;
  const items = [
    ['应配/已配人数', r.need+' / '+r.have],
    ['目标/已覆盖市场', r.targetMkts+' / '+r.coveredMkts],
    ['覆盖率', pct(r.coverRate)],
    ['全年标准量', r.stdReports],
    ['已完成频次', r.doneFreq],
    ['完成率', pct(r.doneRate)],
    ['额外市场', r.extraMkts],
    ['额外频次', r.extraFreq]
  ];
  document.getElementById('mGrid').innerHTML = items.map(([k,v])=>
    `<div class="mitem"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
  document.getElementById('modalMask').classList.add('show');
  if (!modalChart) modalChart = echarts.init(document.getElementById('mChartBox'));
  modalChart.setOption({
    grid:{ left:36, right:16, top:20, bottom:26 },
    tooltip:{ trigger:'axis', backgroundColor:'rgba(255,255,255,.96)',
              borderColor:'#ccd6e3', textStyle:{ color:'#222' } },
    xAxis:{ type:'category', data:MONTHS,
      axisLabel:{ color:'#888' }, axisLine:{ lineStyle:{ color:'#ccd6e3' } },
      axisTick:{ show:false } },
    yAxis:{ type:'value', splitLine:{ lineStyle:{ color:'#f0f0f0' } },
            axisLabel:{ color:'#888' } },
    series:[{ type:'bar', data:r.months, barWidth:18,
      itemStyle:{ borderRadius:[4,4,0,0],
        color:{ type:'linear', x:0, y:0, x2:0, y2:1,
          colorStops:[{offset:0,color:'#2b5aa7'},{offset:1,color:'rgba(43,90,167,.25)'}] } } }]
  });
  modalChart.resize();
}
document.getElementById('modalClose').addEventListener('click', ()=>
  document.getElementById('modalMask').classList.remove('show'));
document.getElementById('modalMask').addEventListener('click', e=>{
  if (e.target.id==='modalMask') e.target.classList.remove('show');
});

/* ---------- controls ---------- */
function renderRegionSel(){
  const sel = document.getElementById('regionSel');
  sel.innerHTML = `<option value="all">全部区域</option>` +
    DATA.regions.map(r=>`<option value="${r}">${r}</option>`).join('');
  sel.value = state.region;
}
document.getElementById('regionSel').addEventListener('change', e=>{
  state.region = e.target.value; renderAll();
});
document.getElementById('searchBox').addEventListener('input', e=>{
  state.search = e.target.value; renderAll();
});
document.getElementById('resetBtn').addEventListener('click', ()=>{
  state.region='all'; state.search=''; state.sortKey='doneRate'; state.sortDir=-1;
  document.getElementById('searchBox').value='';
  document.getElementById('regionSel').value='all';
  renderAll();
});

/* ---------- clock ---------- */
function tickClock(){
  const d = new Date();
  const wk = '日一二三四五六'[d.getDay()];
  const p = n => String(n).padStart(2,'0');
  document.getElementById('clock').textContent =
    d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+
    p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+' 星期'+wk;
}

/* ---------- master render ---------- */
function renderAll(){
  const list = getFiltered();
  document.getElementById('countLabel').textContent =
    '共 '+list.length+' 家工厂 / 总 '+DATA.records.length+' 家';
  renderCards(list);
  renderRegionBars();
  renderGauge(list);
  renderTrend(list);
  renderTop(list);
  renderWarn(list);
  renderRing(list);
  renderHead();
  renderTable(list);
}

/* ---------- init ---------- */
['gauge','radar','trend','top','warn','ring'].forEach(id=>{
  charts[id] = echarts.init(document.getElementById(id+'Box'));
});
document.getElementById('factCount').textContent = DATA.records.length + '家工厂';
renderRegionSel();
renderRadar();
renderAll();
tickClock();
setInterval(tickClock, 1000);
window.addEventListener('resize', ()=>{
  for (const k in charts) { if (charts[k]) charts[k].resize(); }
  if (modalChart) modalChart.resize();
});
</script>
</body>
</html>
