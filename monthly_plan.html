<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>市场数据洞察中心</title>
<link rel="apple-touch-icon" sizes="180x180" href="/dashboard/icon_daily-180.png?v=7">
<link rel="icon" type="image/png" sizes="192x192" href="/dashboard/icon_daily-192.png?v=7">
<link rel="icon" type="image/png" sizes="32x32" href="/dashboard/favicon-32.png">
<link rel="manifest" href="/dashboard/manifest_daily.json">
<meta name="theme-color" content="#1a3a6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="市场数据洞察中心-月度工作计划">
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<style>
  :root{
    --bg:#f4f6fa; --card:#ffffff; --ink:#1f2733; --sub:#6b7686;
    --line:#e6eaf1; --brand:#1a56db; --brand-soft:#e8f0fe;
    --good:#188a42; --warn:#c47b00; --bad:#c0392b; --teal:#0d9488;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Helvetica Neue",Helvetica,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","微软雅黑",Arial,sans-serif;background:var(--bg);color:var(--ink);padding:20px 22px 48px}
  .wrap{max-width:1600px;margin:0 auto}
  h1{font-size:22px;font-weight:700}
  .meta{color:var(--sub);font-size:13px}
  .meta b{color:var(--brand)}
  /* banner */
  .banner{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;
    padding:22px 30px;margin-bottom:14px;border-radius:12px;overflow:hidden;
    background:linear-gradient(135deg,#1a3a6b,#2b5aa7);color:#fff}
  .banner h1{font-size:clamp(13px,4.2vw,25px);font-weight:600;letter-spacing:1px;white-space:nowrap}
  .banner h1 .diamond{color:#7db4ff;margin-right:6px}
  .banner .sub{margin-top:6px;font-size:12.5px;opacity:.85;letter-spacing:1px}
  .banner .meta{margin-top:8px;font-size:12px;color:#dbe7ff}
  .banner .meta b{color:#8ef0b8}
  .b-right{text-align:right}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#8ef0b8;letter-spacing:2px;
    border:1px solid rgba(142,240,184,.5);border-radius:20px;padding:3px 12px}
  .live .dot{width:7px;height:7px;border-radius:50%;background:#8ef0b8;box-shadow:0 0 8px #8ef0b8;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  #clock{margin-top:8px;font-size:13px;color:#dbe7ff;font-variant-numeric:tabular-nums;letter-spacing:1px}
  @media (max-width:640px){
    body{padding:12px 10px 40px}
    .banner{flex-direction:column;align-items:flex-start;gap:10px;padding:18px 16px}
    .b-right{text-align:left}
  }
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(20,40,80,.05)}
  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
  .f-item{display:flex;flex-direction:column;gap:4px}
  .f-item label{font-size:12px;color:var(--sub)}
  select{min-width:130px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px;color:var(--ink);outline:none;cursor:pointer}
  select:focus{border-color:var(--brand)}
  .ac-wrap{position:relative;min-width:150px}
  .ac-wrap input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px;color:var(--ink);outline:none;box-sizing:border-box}
  .ac-wrap input:focus{border-color:var(--brand)}
  .ac-list{position:absolute;top:100%;left:0;right:0;max-height:200px;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.12);z-index:999;display:none}
  .ac-list.open{display:block}
  .ac-list div{padding:8px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid #f5f5f5}
  .ac-list div:hover,.ac-list div.hl{background:#eef4ff;color:var(--brand)}
  .ac-list div:last-child{border-bottom:none}
  .home-back{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;background:#fff;color:var(--brand);font-size:13px;font-weight:600;text-decoration:none;border:1px solid var(--line);margin-bottom:12px;box-shadow:0 1px 3px rgba(20,40,80,.06)}
  .home-back:active{background:var(--brand-soft)}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .kpi .v{font-size:24px;font-weight:700;margin-top:4px}
  .kpi .l{font-size:12px;color:var(--sub)}
  .kpi .s{font-size:11px;color:var(--sub);margin-top:2px}
  .v.good{color:var(--good)} .v.warn{color:var(--warn)} .v.bad{color:var(--bad)} .v.brand{color:var(--brand)} .v.teal{color:var(--teal)}
  .chart-box{height:300px;width:100%}
  .tbl-wrap{overflow:auto;border-radius:8px;border:1px solid var(--line);max-height:70vh}
  table{border-collapse:separate;border-spacing:0;width:100%;min-width:2100px;font-size:12.5px}
  th,td{padding:7px 9px;border-bottom:1px solid var(--line);border-right:1px solid #f0f2f5;white-space:nowrap;text-align:center}
  th{background:#eef2f9;color:#1a337a;font-weight:600;cursor:pointer;user-select:none;position:sticky;top:0;z-index:10}
  th:hover{background:#e2eaf7}
  .col-filter{position:sticky;top:33px;z-index:9;background:#fff}
  .col-filter td{padding:3px 4px;border-bottom:2px solid var(--line)}
  .col-filter input{width:100%;padding:3px 6px;border:1px solid #ddd;border-radius:4px;font-size:11px;outline:none;box-sizing:border-box}
  .col-filter input:focus{border-color:var(--brand)}
  td.dim{text-align:left}
  tbody tr:nth-child(even){background:#fafbfd}
  tbody tr:hover{background:#f0f6ff}
  .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
  .tag.tg{background:#e8f0fe;color:#1a56db}
  .tag.done{background:#e9f5ec;color:#188a42}
  .tag.note{background:#fff4e2;color:#c47b00}
  .rt{display:block;font-size:11.5px;color:#3a4557;text-align:left}
  .rt-empty{color:#b6bfcc}
  .muted{color:#b6bfcc}
  .sec-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .sec-title::before{content:"";width:4px;height:16px;background:var(--brand);border-radius:2px}
  .panel>.sec-title{cursor:pointer}
  .fold-ind{font-size:10px;color:#999;margin-left:6px;transition:transform .2s}
  .panel.collapsed>.sec-title~*{display:none!important}
  .panel.collapsed .fold-ind{transform:rotate(-90deg)}
  .count-note{font-size:12px;color:var(--sub);font-weight:400}
  footer{margin-top:18px;color:var(--sub);font-size:12px;text-align:center;line-height:1.8}
  .sort-ind{font-size:10px;color:var(--brand)}
</style>
</head>
<body>
<div class="wrap">
  <div class="banner">
    <div>
      <h1><span class="diamond">&#9670;</span>市场数据洞察中心</h1>
      <div class="sub">工厂督察 · 8月月度工作计划（全国汇总版）</div>
      <div class="meta">计划月份 <b id="m-month"></b> ｜ 数据更新 <span id="m-gen"></span></div>
    </div>
    <div class="b-right">
      <div class="live"><span class="dot"></span>LIVE</div>
      <div id="clock"></div>
    </div>
  </div>
  <a class="home-back" href="daily.html">&#8592; 返回首页</a>

  <div class="panel">
    <div class="sec-title">维度筛选 <span class="count-note">（下拉选择 + 姓名/市场/工厂/营业所联想输入，多条件同时生效）</span></div>
    <div class="filters" id="filter-bar"></div>
  </div>

  <div class="panel">
    <div class="sec-title">关键指标 <span class="count-note">（随筛选实时变化，点击标题折叠/展开）</span></div>
    <div class="cards" id="kpi-cards"></div>
  </div>

  <div class="panel">
    <div class="sec-title">各区检查排班分布 <span class="count-note">（按当前筛选）</span></div>
    <div id="chart-region" class="chart-box"></div>
  </div>

  <div class="panel">
    <div class="sec-title">排班明细表 <span class="count-note" id="tbl-count"></span> <span class="count-note">（点击表头排序，第二行输入关键字过滤）</span></div>
    <div class="tbl-wrap" id="tblWrap">
      <table id="detail-tbl">
        <thead><tr id="tbl-head"></tr><tr class="col-filter" id="tbl-filter"></tr></thead>
        <tbody id="tbl-body"></tbody>
      </table>
    </div>
  </div>

  <footer>口径：数据源《工厂周边市场检查计划-全国汇总-202608》（sheet 26-08）；<br>月度目标取自"目标-8"，完成取自"完成-8"；线路1-9=8月计划检查街道/路线；显示时已过滤姓名为"/"或空行的占位行。</footer>
</div>

  for(var i=1;i<=ROUTE_COUNT;i++) COLS.push('线路'+i);
  var state = {区域:'全部',分公司:'全部',姓名:'',标准市场:'',所在工厂:'',营业所:''};
  var colFilter = {}; COLS.forEach(function(c){colFilter[c]='';});
  var sortCol = null, sortDir = 1;

  /* ---------- filters ---------- */
  var bar = document.getElementById('filter-bar');
  function uniq(key){ var s={}; ROWS.forEach(function(r){s[r[key]]=1;}); return Object.keys(s).sort(); }
  function mkSelect(key,label){
    var item=document.createElement('div'); item.className='f-item';
    var lab=document.createElement('label'); lab.textContent=label;
    var sel=document.createElement('select');
    ['全部'].concat(uniq(key)).forEach(function(v){
      var o=document.createElement('option'); o.value=v; o.textContent=v; sel.appendChild(o);
    });
    sel.onchange=function(){ state[key]=sel.value; render(); };
    item.appendChild(lab); item.appendChild(sel); bar.appendChild(item);
  }
  function mkAc(key,label){
    var item=document.createElement('div'); item.className='f-item';
    var lab=document.createElement('label'); lab.textContent=label;
    var wrap=document.createElement('div'); wrap.className='ac-wrap';
    var inp=document.createElement('input'); inp.placeholder='全部（可输入联想）'; inp.autocomplete='off';
    var list=document.createElement('div'); list.className='ac-list';
    var opts=uniq(key), hl=-1;
    function fill(kw){
      list.innerHTML=''; hl=-1;
      var show=kw?opts.filter(function(o){return o.toLowerCase().indexOf(kw.toLowerCase())>=0;}):opts;
      show.slice(0,50).forEach(function(o){
        var d=document.createElement('div'); d.textContent=o;
        d.onclick=function(){ inp.value=o; state[key]=o; list.classList.remove('open'); render(); };
        list.appendChild(d);
      });
      list.classList.toggle('open', show.length>0 && document.activeElement===inp);
    }
    inp.onfocus=function(){ fill(inp.value); };
    inp.oninput=function(){ state[key]=inp.value.trim(); fill(inp.value); render(); };
    inp.onkeydown=function(e){
      var ds=list.querySelectorAll('div');
      if(e.key==='ArrowDown'){hl=Math.min(hl+1,ds.length-1);}
      else if(e.key==='ArrowUp'){hl=Math.max(hl-1,0);}
      else if(e.key==='Enter'){ if(hl>=0&&ds[hl]){ds[hl].click();} list.classList.remove('open'); e.preventDefault(); return;}
      else if(e.key==='Escape'){list.classList.remove('open'); return;}
      else return;
      e.preventDefault();
      ds.forEach(function(d,i){d.classList.toggle('hl',i===hl);});
      if(ds[hl]) ds[hl].scrollIntoView({block:'nearest'});
    };
    document.addEventListener('click',function(e){ if(!wrap.contains(e.target)) list.classList.remove('open'); });
    wrap.appendChild(inp); wrap.appendChild(list);
    item.appendChild(lab); item.appendChild(wrap); bar.appendChild(item);
  }
  mkSelect('区域','区域'); mkSelect('分公司','分公司');
  mkAc('姓名','姓名'); mkAc('标准市场','标准市场'); mkAc('所在工厂','所在工厂'); mkAc('营业所','营业所');

  /* ---------- helpers ---------- */
  function numTxt(v){ return (v===null||v===undefined||v==='') ? '<span class="muted">—</span>' : v; }
  function routeCell(v){ return v ? '<span class="rt">'+v+'</span>' : '<span class="rt rt-empty">—</span>'; }

  /* ---------- filter pipeline ---------- */
  function filtered(){
    return ROWS.filter(function(r){
      if(state.区域!=='全部' && r.区域!==state.区域) return false;
      if(state.分公司!=='全部' && r.分公司!==state.分公司) return false;
      if(state.姓名 && r.姓名.toLowerCase().indexOf(state.姓名.toLowerCase())<0) return false;
      if(state.标准市场 && r.标准市场.toLowerCase().indexOf(state.标准市场.toLowerCase())<0) return false;
      if(state.所在工厂 && r.所在工厂.toLowerCase().indexOf(state.所在工厂.toLowerCase())<0) return false;
      if(state.营业所 && r.营业所.toLowerCase().indexOf(state.营业所.toLowerCase())<0) return false;
      for(var i=0;i<COLS.length;i++){
        var kw=colFilter[COLS[i]];
        if(kw){
          var rv = COLS[i].indexOf('线路')===0 ? r.线路[parseInt(COLS[i].replace('线路',''))-1] : r[COLS[i]];
          if(String(rv).toLowerCase().indexOf(kw.toLowerCase())<0) return false;
        }
      }
      return true;
    });
  }

  /* ---------- KPI ---------- */
  function renderKpi(rs){
    var ppl={},mkt={},fac={},targetSum=0,targetRows=0;
    rs.forEach(function(r){
      ppl[r.姓名]=1; mkt[r.标准市场]=1; fac[r.所在工厂]=1;
      if(r.月度目标!==null && r.月度目标!==''){ targetSum += Number(r.月度目标); targetRows++; }
    });
    var avg = targetRows ? Math.round(targetSum/targetRows*10)/10 : 0;
    var cards=[
      {l:'计划督察人数',v:Object.keys(ppl).length,c:'brand',s:'当前筛选下'},
      {l:'标准市场数',v:Object.keys(mkt).length,c:'teal',s:'当前筛选下'},
      {l:'所在工厂数',v:Object.keys(fac).length,c:'brand',s:'当前筛选下'},
      {l:'月度目标合计',v:targetSum,c:'warn',s:'有目标行共 '+targetRows+' 条'},
      {l:'月度目标均值',v:avg,c:'teal',s:'有目标行平均'}
    ];
    document.getElementById('kpi-cards').innerHTML = cards.map(function(k){
      return '<div class="kpi"><div class="l">'+k.l+'</div><div class="v '+k.c+'">'+k.v+'</div><div class="s">'+k.s+'</div></div>';
    }).join('');
  }

  /* ---------- chart ---------- */
  var chart = echarts.init(document.getElementById('chart-region'));
  window.addEventListener('resize',function(){chart.resize();});
  function renderChart(rs){
    var cnt={};
    rs.forEach(function(r){cnt[r.区域]=(cnt[r.区域]||0)+1;});
    var regions=['东','南','西','北'].filter(function(k){return cnt[k];});
    chart.setOption({
      tooltip:{trigger:'axis',axisPointer:{type:'shadow'}},
      grid:{left:60,right:40,top:20,bottom:30},
      xAxis:{type:'value',minInterval:1},
      yAxis:{type:'category',data:regions,axisLabel:{fontSize:13}},
      series:[{type:'bar',data:regions.map(function(k){return cnt[k];}),barWidth:26,
        itemStyle:{borderRadius:[0,6,6,0],color:new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:'#1a56db'},{offset:1,color:'#3b82f6'}])},
        label:{show:true,position:'right',fontWeight:700,color:'#1a337a',formatter:'{c} 个市场'}}]
    });
  }

  /* ---------- table ---------- */
  var thead=document.getElementById('tbl-head'), tfilter=document.getElementById('tbl-filter'), tbody=document.getElementById('tbl-body');
  function buildHead(){
    thead.innerHTML=''; tfilter.innerHTML='';
    COLS.forEach(function(c){
      var th=document.createElement('th');
      th.innerHTML=c+' <span class="sort-ind" data-c="'+c+'"></span>';
      th.onclick=function(){
        if(sortCol===c){sortDir=-sortDir;}else{sortCol=c;sortDir=1;}
        render();
      };
      thead.appendChild(th);
      var td=document.createElement('td');
      var inp=document.createElement('input'); inp.placeholder='过滤…';
      inp.oninput=function(){ colFilter[c]=inp.value.trim(); render(); };
      td.appendChild(inp); tfilter.appendChild(td);
    });
  }
  function getSortVal(r){
    if(sortCol===null) return null;
    if(sortCol.indexOf('线路')===0) return r.线路[parseInt(sortCol.replace('线路',''))-1];
    return r[sortCol];
  }
  function cmp(a,b){
    var x=getSortVal(a), y=getSortVal(b);
    if(typeof x==='number'&&typeof y==='number') return (x-y)*sortDir;
    if(x===null||x===undefined) x=''; if(y===null||y===undefined) y='';
    return String(x).localeCompare(String(y),'zh-CN')*sortDir;
  }
  function renderTable(rs){
    var out=rs.slice();
    if(sortCol) out.sort(cmp);
    document.querySelectorAll('.sort-ind').forEach(function(s){ s.textContent = s.dataset.c===sortCol ? (sortDir>0?'▲':'▼') : ''; });
    tbody.innerHTML = out.map(function(r){
      var cells = '<td>'+r.区域+'</td>'+
        '<td class="dim">'+r.分公司+'</td>'+
        '<td class="dim">'+r.营业所+'</td>'+
        '<td class="dim">'+r.标准市场+'</td>'+
        '<td><b>'+r.姓名+'</b></td>'+
        '<td class="dim">'+r.所在工厂+'</td>'+
        '<td>'+(r.月度目标!==null&&r.月度目标!==''?'<span class="tag tg">'+r.月度目标+'</span>':'<span class="muted">—</span>')+'</td>'+
        '<td>'+(r.完成!==null&&r.完成!==''?'<span class="tag done">'+r.完成+'</span>':'<span class="muted">—</span>')+'</td>'+
        '<td>'+(r.备注?'<span class="tag note">'+r.备注+'</span>':'<span class="muted">—</span>')+'</td>';
      for(var i=0;i<ROUTE_COUNT;i++){
        cells += '<td class="dim">'+routeCell(r.线路[i])+'</td>';
      }
      return '<tr>'+cells+'</tr>';
    }).join('');
    document.getElementById('tbl-count').textContent='（共 '+out.length+' 条排班）';
  }

  /* ---------- fold ---------- */
  document.querySelectorAll('.panel>.sec-title').forEach(function(t){
    t.addEventListener('click',function(){
      t.parentElement.classList.toggle('collapsed');
      var ind=t.querySelector('.fold-ind');
      if(!ind){ ind=document.createElement('span'); ind.className='fold-ind'; ind.textContent='▼'; t.appendChild(ind); }
      if(!t.parentElement.classList.contains('collapsed')) setTimeout(function(){chart.resize();},50);
    });
    var ind=document.createElement('span'); ind.className='fold-ind'; ind.textContent='▼'; t.appendChild(ind);
  });

  function render(){
    var rs=filtered();
    renderKpi(rs); renderChart(rs); renderTable(rs);
  }
  buildHead(); render();
})();
</script>
</body>
</html>
