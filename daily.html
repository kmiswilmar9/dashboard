<link rel="manifest" href="/dashboard/manifest_daily.json">
<link rel="apple-touch-icon" sizes="180x180" href="/dashboard/icon_daily-180.png?v=10">
<link rel="icon" type="image/png" sizes="192x192" href="/dashboard/icon_daily-192.png?v=10">
<meta name="theme-color" content="#1a3a6b">
<meta name="apple-mobile-web-app-capable" content="yes">

<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<style>
  :root{
    --bg:#f4f6fa; --card:#ffffff; --ink:#1f2733; --sub:#6b7686;
    --line:#e6eaf1; --brand:#1a56db; --brand-soft:#e8f0fe;
    --good:#188a42; --warn:#c47b00; --bad:#c0392b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI","Microsoft YaHei",PingFang SC,sans-serif;background:var(--bg);color:var(--ink);padding:20px 22px 48px}
  .wrap{max-width:1500px;margin:0 auto}
  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:14px}
  h1{font-size:22px;font-weight:700}
  .meta{color:var(--sub);font-size:13px}
  .meta b{color:var(--brand)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(20,40,80,.05)}
  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
  .f-item{display:flex;flex-direction:column;gap:4px}
  .f-item label{font-size:12px;color:var(--sub)}
  select{min-width:150px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px;color:var(--ink);outline:none;cursor:pointer}
  select:focus{border-color:var(--brand)}
  .btn{padding:8px 16px;border:none;border-radius:8px;background:var(--brand-soft);color:var(--brand);font-size:13px;font-weight:600;cursor:pointer}
  .btn:hover{background:#d8e6fd}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .kpi .v{font-size:24px;font-weight:700;margin-top:4px}
  .kpi .l{font-size:12px;color:var(--sub)}
  .kpi .s{font-size:11px;color:var(--sub);margin-top:2px}
  .v.good{color:var(--good)} .v.warn{color:var(--warn)} .v.bad{color:var(--bad)} .v.brand{color:var(--brand)}
  .chart-box{height:340px;width:100%}
  .tbl-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--line)}
  table{border-collapse:collapse;width:100%;min-width:1500px;font-size:12.5px}
  th,td{padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:center}
  th{background:#eef2f9;color:#1a337a;font-weight:600;cursor:pointer;user-select:none;position:sticky;top:0}
  th:hover{background:#e2eaf7}
  td.dim{text-align:left}
  tbody tr:nth-child(even){background:#fafbfd}
  tbody tr:hover{background:#f0f6ff}
  .pct{font-weight:600}
  .pct.hi{color:var(--good)} .pct.mid{color:var(--warn)} .pct.lo{color:var(--bad)}
  .cnt.bad{color:var(--bad);font-weight:600}
  .sec-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .sec-title::before{content:"";width:4px;height:16px;background:var(--brand);border-radius:2px}
  .count-note{font-size:12px;color:var(--sub);font-weight:400}
  footer{margin-top:18px;color:var(--sub);font-size:12px;text-align:center}
  .sort-ind{font-size:10px;color:var(--brand)}
</style>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/dashboard/sw.js');}</script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>工厂督察每日达成日报</h1>
    <div class="meta">当月 <b id="m-month"></b> ｜ 报表日期 <b id="m-date"></b> ｜ 数据更新 <span id="m-gen"></span></div>
  </header>

  <div class="panel">
    <div class="sec-title">维度筛选 <span class="count-note">（逐级联动，点选后自动收窄下级选项）</span></div>
    <div class="filters" id="filter-bar"></div>
  </div>

  <div class="cards" id="kpi-cards"></div>

  <div class="panel">
    <div class="sec-title">达成率 TOP 工厂督察 <span class="count-note">（按当前筛选，目标&gt;0，取前10）</span></div>
    <div id="chart-top" class="chart-box"></div>
  </div>

  <div class="panel">
    <div class="sec-title">明细表 <span class="count-note" id="tbl-count"></span> <span class="count-note">（点击表头排序）</span></div>
    <div class="tbl-wrap">
      <table id="detail-tbl">
        <thead><tr id="tbl-head"></tr></thead>
        <tbody id="tbl-body"></tbody>
      </table>
    </div>
  </div>

  <footer>口径：有效网点=门店状态清洗为有效网点；当日达成=报表日当天有效网点数；累计达成=当月累计有效网点数；达成率=累计达成÷月度目标；计划匹配=该（督查,市场）是否在月度计划内；错误率=填写错误÷检查门店数；虚假数据=已成交却关店/无效（单独考核） ｜ 益海嘉里 华东区&amp;东北区 工厂督察</footer>
</div>

const ROWS = DATA.rows || [];
const DIMS = ['区域','分公司','营业所','工厂督查姓名','所在工厂','标准市场','计划匹配'];
const LINE_COLS = ['油有效家数','米有效家数','面粉有效家数','挂面有效家数','调味油及酱料有效家数','酱油有效家数','醋有效家数','日化有效家数'];
const COLS = [
  {k:'区域',t:'text'},{k:'分公司',t:'text'},{k:'营业所',t:'text'},{k:'工厂督查姓名',t:'text'},
  {k:'所在工厂',t:'text'},{k:'标准市场',t:'text'},
  {k:'月度目标',t:'num'},{k:'当日达成',t:'num'},{k:'累计达成',t:'num'},{k:'达成率',t:'pct'},{k:'计划匹配',t:'text'},
  {k:'当日检查门店数',t:'num'},{k:'检查门店数',t:'num'},
  {k:'当日费用',t:'money'},{k:'累计费用',t:'money'},
  ...LINE_COLS.map(k=>({k,t:'num'})),
  {k:'填写错误',t:'num'},{k:'虚假数据',t:'num'},{k:'重复填写',t:'num'},{k:'非计划内',t:'num'},
  {k:'错误率',t:'pct'},{k:'虚假数据率',t:'pct'}
];
const state = {}; DIMS.forEach(d=>state[d]=null);
let sortKey='达成率', sortDir=-1;
let chart=null;

document.getElementById('m-month').textContent = DATA.month||'';
document.getElementById('m-date').textContent = DATA.report_date||'';
document.getElementById('m-gen').textContent = DATA.generated||'';

function filteredRows(excludeDim){
  return ROWS.filter(r=>DIMS.every(d=>{
    if(d===excludeDim) return true;
    return state[d]==null || String(r[d])===state[d];
  }));
}
function applyFilters(){ return filteredRows(null); }

function buildFilters(){
  const bar=document.getElementById('filter-bar');
  bar.innerHTML='';
  DIMS.forEach(d=>{
    const item=document.createElement('div'); item.className='f-item';
    const lab=document.createElement('label'); lab.textContent=d;
    const sel=document.createElement('select'); sel.id='f-'+d;
    const opts=new Set();
    filteredRows(d).forEach(r=>{const v=String(r[d]||'').trim(); if(v&&v!=='nan')opts.add(v);});
    const sorted=[...opts].sort((a,b)=>a.localeCompare(b,'zh'));
    sel.appendChild(new Option('全部',''));
    sorted.forEach(v=>sel.appendChild(new Option(v,v)));
    if(state[d]!=null && opts.has(state[d])) sel.value=state[d]; else {sel.value=''; state[d]=null;}
    sel.onchange=()=>{ state[d]=sel.value||null; refresh(); };
    item.appendChild(lab); item.appendChild(sel); bar.appendChild(item);
  });
  const reset=document.createElement('button'); reset.className='btn'; reset.textContent='重置筛选';
  reset.onclick=()=>{DIMS.forEach(d=>state[d]=null); refresh();};
  bar.appendChild(reset);
}

function pct(v){ return (v*100).toFixed(1)+'%'; }
function pctClass(v){ return v>=1?'hi':(v>=0.6?'mid':'lo'); }

function renderCards(rows){
  const sum=k=>rows.reduce((s,r)=>s+(+r[k]||0),0);
  const target=sum('月度目标'), validDay=sum('当日达成'), validCum=sum('累计达成');
  const checkedDay=sum('当日检查门店数'), checked=sum('检查门店数');
  const dayFee=sum('当日费用'), cumFee=sum('累计费用');
  const err=sum('填写错误'), fake=sum('虚假数据'), dup=sum('重复填写'), outp=sum('非计划内');
  const rate=target>0?validCum/target:0;
  const errRate=checked>0?err/checked:0;
  const fakeRate=checked>0?fake/checked:0;
  const persons=new Set(rows.map(r=>r['工厂督查姓名'])).size;
  const inPlan=rows.filter(r=>r['计划匹配']==='计划内').length;
  const outPlan=rows.length-inPlan;
  const cards=[
    {l:'月度目标（有效网点）',v:target.toLocaleString(),c:'brand',s:'计划内 '+inPlan+' ／ 计划外 '+outPlan+' 个市场'},
    {l:'当日达成',v:validDay.toLocaleString(),c:'',s:'报表日当天有效网点'},
    {l:'累计达成',v:validCum.toLocaleString(),c:'',s:'当月累计有效网点'},
    {l:'整体达成率',v:pct(rate),c:rate>=1?'good':(rate>=0.6?'warn':'bad'),s:'累计达成 ÷ 月度目标'},
    {l:'当日检查门店',v:checkedDay.toLocaleString(),c:'',s:'累计检查 '+checked.toLocaleString()+' 家'},
    {l:'当日激励费用(元)',v:Math.round(dayFee).toLocaleString(),c:'brand',s:'报表日当天核算毛额'},
    {l:'累计激励费用(元)',v:Math.round(cumFee).toLocaleString(),c:'brand',s:'当月累计核算毛额'},
    {l:'督察错误率',v:pct(errRate),c:errRate>0.1?'bad':(errRate>0?'warn':'good'),s:'填写错误'+err+' ÷ 检查门店'},
    {l:'虚假数据率',v:pct(fakeRate),c:fakeRate>0.1?'bad':(fakeRate>0?'warn':'good'),s:'虚假数据'+fake+'（已成交却关店/无效）'}
  ];
  document.getElementById('kpi-cards').innerHTML=cards.map(c=>
    '<div class="kpi"><div class="l">'+c.l+'</div><div class="v '+c.c+'">'+c.v+'</div><div class="s">'+c.s+'</div></div>').join('');
}

function renderChart(rows){
  const el=document.getElementById('chart-top');
  if(!chart){ chart=echarts.init(el); window.addEventListener('resize',()=>chart.resize()); }
  const data=rows.filter(r=>(+r['月度目标']||0)>0)
    .map(r=>({name:r['工厂督查姓名'],val:+r['达成率']||0}))
    .sort((a,b)=>a.val-b.val).slice(-10);
  chart.setOption({
    grid:{left:90,right:60,top:10,bottom:20},
    tooltip:{trigger:'axis',axisPointer:{type:'shadow'},formatter:p=>p[0].name+'：'+(p[0].value*100).toFixed(1)+'%'},
    xAxis:{type:'value',axisLabel:{formatter:v=>(v*100)+'%'},splitLine:{lineStyle:{color:'#eef1f6'}}},
    yAxis:{type:'category',data:data.map(d=>d.name),axisLabel:{fontSize:12}},
    series:[{type:'bar',data:data.map(d=>d.val),barWidth:'60%',
      itemStyle:{color:p=>p.value>=1?'#188a42':(p.value>=0.6?'#c47b00':'#1a56db'),borderRadius:[0,4,4,0]},
      label:{show:true,position:'right',formatter:p=>(p.value*100).toFixed(0)+'%',fontSize:11}}]
  },true);
}

function fmtCell(col,r){
  const v=r[col.k];
  if(col.k==='计划匹配'){ return v==='计划外'?'<span class="cnt bad">计划外</span>':'计划内'; }
  if(col.t==='money'){ const x=+v||0; return x===0?'0':'<span style="color:#188a42;font-weight:600">'+x.toLocaleString()+'</span>'; }
  if(col.t==='pct'){ const x=+v||0; return '<span class="pct '+pctClass(x)+'">'+pct(x)+'</span>'; }
  if(col.t==='num'){
    const x=+v||0;
    if(['填写错误','虚假数据','重复填写','非计划内'].includes(col.k) && x>0) return '<span class="cnt bad">'+x+'</span>';
    return x;
  }
  return String(v==null?'':v);
}

function renderTable(rows){
  const head=document.getElementById('tbl-head');
  head.innerHTML=COLS.map(c=>{
    const ind=c.k===sortKey?('<span class="sort-ind">'+(sortDir===1?'▲':'▼')+'</span>'):'';
    return '<th data-k="'+c.k+'">'+c.k+ind+'</th>';
  }).join('');
  head.querySelectorAll('th').forEach(th=>{
    th.onclick=()=>{ const k=th.dataset.k; if(sortKey===k)sortDir=-sortDir; else {sortKey=k;sortDir=-1;} renderTable(currentRows); };
  });
  const col=COLS.find(c=>c.k===sortKey)||COLS[0];
  const sorted=[...rows].sort((a,b)=>{
    let x=a[sortKey],y=b[sortKey];
    if(col.t==='text'){ return String(x||'').localeCompare(String(y||''),'zh')*sortDir; }
    return ((+x||0)-(+y||0))*sortDir;
  });
  document.getElementById('tbl-body').innerHTML=sorted.map(r=>
    '<tr>'+COLS.map(c=>{
      const cls=(c.t==='text')?' class="dim"':'';
      return '<td'+cls+'>'+fmtCell(c,r)+'</td>';
    }).join('')+'</tr>').join('');
  document.getElementById('tbl-count').textContent='（当前筛选 '+rows.length+' 行）';
}

let currentRows=[];
function refresh(){
  buildFilters();
  currentRows=applyFilters();
  renderCards(currentRows);
  renderChart(currentRows);
  renderTable(currentRows);
}
refresh();
</script>
